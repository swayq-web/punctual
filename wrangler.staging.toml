#:schema node_modules/wrangler/config-schema.json
# SwayQ booking Worker, staging. Derived from wrangler.toml (the self-host
# template). Deploy: .github/workflows/swayq-deploy.yml. See SWAYQ.md.
#
# Every placeholder token (REPLACE_WITH_ prefix) below is a placeholder the operator fills from
# `terraform output` in the swayq repo after `terraform apply`. The deploy
# workflow refuses to run while any placeholder remains in this file.
name = "swayq-booking-staging"
main = "src/index.ts"
compatibility_date = "2025-08-23"
compatibility_flags = ["nodejs_compat"]

# Custom domain. Wrangler owns the route (ADR-0004); no DNS/route in Terraform.
routes = [{ pattern = "book.sway-q.com", custom_domain = true }]

[assets]
directory = "./assets"

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "swayq-booking-staging"
# terraform output booking_d1_database_ids.staging
database_id = "REPLACE_WITH_D1_ID_STAGING"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "CACHE"
# terraform output booking_kv_cache_ids.staging
id = "REPLACE_WITH_KV_ID_STAGING"

# No AVATARS (R2) binding: the app uses a null blob storage when it is absent
# (avatar/logo uploads fail with a clear error). See SWAYQ.md.
# No INSIGHTS (Analytics Engine) binding: optional in the app (Env.INSIGHTS?).

[[durable_objects.bindings]]
name = "HOST_CALENDAR"
class_name = "HostCalendar"

[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["HostCalendar", "RateLimiter"]

[[queues.producers]]
binding = "TASKS"
queue = "swayq-booking-tasks-staging"

[[queues.consumers]]
queue = "swayq-booking-tasks-staging"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 5
dead_letter_queue = "swayq-booking-tasks-staging-dlq"

# The DLQ has a consumer of its own: handleQueueBatch routes any queue whose
# name ends in -dlq to the dead-letter handler (src/adapters/queue/consumer.ts).
[[queues.consumers]]
queue = "swayq-booking-tasks-staging-dlq"
max_batch_size = 10
max_batch_timeout = 30
max_retries = 3

# Reminders at 24h and 1h, plus hold expiry and lock pruning.
[triggers]
crons = ["*/5 * * * *"]

[vars]
BASE_URL = "https://book.sway-q.com"
BRAND_NAME = "SwayQ"
LEGAL_OPERATOR = "SwayQ ApS" # confirm legal entity name (SWAYQ.md)
FROM_EMAIL = "booking@swayq.com"
FROM_NAME = "SwayQ"
SUPPORT_EMAIL = "jh@swayq.com"
EMAIL_PROVIDER = "resend"
# parseSignupPolicy: comma list of exact emails and "@domain" suffixes.
SIGNUPS = "@swayq.com"
INTERNAL_ALLOWED_DOMAINS = "swayq.com"
TURNSTILE_REQUIRED = "true"
# terraform output booking_turnstile_site_keys.staging (public)
TURNSTILE_SITE_KEY = "REPLACE_WITH_TURNSTILE_SITE_KEY_STAGING"
TELEMETRY_ENABLED = "0"

# Secrets (pushed by the deploy workflow, never in this file):
#   GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, ENCRYPTION_KEY_V1, SIGNING_KEY,
#   RESEND_API_KEY, TURNSTILE_SECRET, INTERNAL_SERVICE_TOKEN
